
name: WallSight Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java 25.0.1
        uses: actions/setup-java@v5
        with:
          java-version: '25.0.1'
          distribution: temurin

      - name: Show Java version
        run: java -version

      - name: Run self-tests
        run: bash run-selftest.sh

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Minecraft mod
        run: ./gradlew build --stacktrace

      - name: Verify JAR
        run: python3 scripts/verify_jar.py build/libs/DarkVenice_Wallsight_26_1_2.jar

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v7
        with:
          name: DarkVenice_Wallsight_26_1_2
          path: build/libs/DarkVenice_Wallsight_26_1_2.jar
          if-no-files-found: error

      - name: Attach JAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/DarkVenice_Wallsight_26_1_2.jar --title "WallSight $GITHUB_REF_NAME" --generate-notes
